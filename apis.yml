name: Glorify
description: >-
  Glorify is a Christian devotional and worship mobile application that helps
  people build a daily faith and wellbeing practice. The app delivers daily
  devotionals, Bible passages and inspirational quotes alongside guided
  meditations, prayer, sleep stories, worship music playlists, and audio courses
  led by theologians and authors, plus a community for connecting with other
  believers. Glorify also offers a physical wearable, the Glorify Ring. The
  company reports more than 20 million downloads and a 4.9-star average across
  over one million reviews, and is backed by Andreessen Horowitz (a16z). Glorify
  is a consumer application and does not currently publish a public developer
  API, SDK, or developer portal.
